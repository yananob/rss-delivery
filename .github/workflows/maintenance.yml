name: Maintenance

on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

jobs:
  update-submodules:
    uses: yananob/myapps-common/.github/workflows/update-submodules.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  update-packages:
    uses: yananob/myapps-common/.github/workflows/update-packages.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
